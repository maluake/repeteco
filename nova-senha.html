<body data-page="entrar">
  <header id="site-header"></header>
  <main id="conteudo" tabindex="-1">
    <div class="wrap-narrow section">
      <div class="auth-card">
        <h1>Nova senha</h1>
        <div id="resetInvalid" hidden style="margin-top:1rem">
          <p>Este link expirou ou já foi usado. Peça um novo link de recuperação.</p>
          <p style="margin-top:1rem"><a class="btn" href="entrar.html?modo=recuperar">Pedir novo link</a></p>
        </div>
        <form id="resetForm" hidden novalidate style="display:grid;gap:1rem;margin-top:1.5rem">
          <div class="field">
      <label for="rpPass">Nova senha</label>
      <input class="input" id="rpPass" type="password" autocomplete="new-password">
      <p class="hint" id="rpPass-dica">Mínimo de 8 caracteres.</p>
    </div>
          <div class="field">
      <label for="rpPass2">Repita a nova senha</label>
      <input class="input" id="rpPass2" type="password" autocomplete="new-password">
      
    </div>
          <p class="form-status" id="resetStatus"></p>
          <button class="btn btn-block" type="submit" id="resetBtn">Salvar nova senha</button>
        </form>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <noscript><p class="noscript">O Repeteco precisa de JavaScript para funcionar.</p></noscript>
</body>
