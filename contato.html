<body data-page="contato">
  <header id="site-header"></header>
  <main id="conteudo" tabindex="-1">
    <header class="page-head">
      <h1>Contato</h1>
      <p>Dúvidas, sugestões, problemas com a conta ou com um brechó: escreva para a equipe. Respondemos pelo e-mail informado.</p>
    </header>
    <div class="wrap-narrow" style="padding-bottom:3.5rem">
      <form id="contactForm" class="card card-pad" novalidate style="display:grid;gap:1rem">
        <div class="form-grid">
          <div class="field">
      <label for="ctNome">Nome</label>
      <input class="input" id="ctNome" autocomplete="name" maxlength="80" required>
      
    </div>
          <div class="field">
      <label for="ctEmail">E-mail para resposta</label>
      <input class="input" id="ctEmail" type="email" autocomplete="email" maxlength="160" required>
      
    </div>
        </div>
        <div class="field">
      <label for="ctAssunto">Assunto</label>
      <select class="select" id="ctAssunto">
          <option value="duvida">Dúvida geral</option><option value="brecho">Cadastro ou painel de brechó</option>
          <option value="imprensa">Imprensa</option><option value="parceria">Parcerias</option>
          <option value="privacidade">Privacidade e dados</option><option value="acessibilidade">Acessibilidade</option><option value="outro">Outro</option></select>
      
    </div>
        <div class="field">
      <label for="ctMensagem">Mensagem</label>
      <textarea class="textarea" id="ctMensagem" maxlength="3000" rows="6" required></textarea>
      
    </div>
        <p class="small muted">Pedidos sobre seus dados pessoais: escolha “Privacidade e dados”. Barreiras de acessibilidade: escolha “Acessibilidade”.</p>
        <p class="form-status" id="contactStatus" tabindex="-1"></p>
        <div><button class="btn" type="submit" id="contactBtn">enviar mensagem</button></div>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <noscript><p class="noscript">O Repeteco precisa de JavaScript para funcionar.</p></noscript>
</body>
