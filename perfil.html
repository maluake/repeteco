<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu perfil — Repeteco</title>
  <meta name="description" content="Edite seu nome, foto, cidade e bio no Repeteco.">
  <meta name="robots" content="noindex">
  <meta property="og:site_name" content="Repeteco">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Meu perfil">
  <meta property="og:description" content="Edite seu nome, foto, cidade e bio no Repeteco.">
  <meta property="og:image" content="assets/img/og-repeteco.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2D1B4E">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script src="assets/js/a11y.js"></script>
  <script defer src="assets/vendor/supabase-2.117.2.js"></script>
  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/core.js"></script>
  <script defer src="assets/js/vocab.js"></script>
  <script defer src="assets/js/layout.js"></script>
  <script defer src="assets/js/interactions.js"></script>
  <script defer src="assets/js/render.js"></script>
  <script defer src="assets/js/media.js"></script>
  <script defer src="assets/js/pages/perfil.js"></script>
</head>
<body data-page="perfil">
  <header id="site-header"></header>
  <main id="conteudo" tabindex="-1">
    <div class="wrap section" style="padding-bottom:0">
      <h1>Meu perfil</h1>
      <p class="muted" id="memberSince" style="margin-top:.5rem"></p>
    </div>
    <div class="wrap profile-layout">
      <div class="avatar-edit">
        <div class="avatar-lg" id="avatarPreview" aria-live="polite"></div>
        <span class="btn btn-outline btn-sm file-btn">Escolher foto<input type="file" id="avatarFile" form="profileForm" aria-label="Escolher foto de perfil (JPG, PNG ou WebP)"></span>
        <button class="btn btn-ghost btn-sm" type="button" id="avatarRemove" hidden>Remover foto</button>
        <p class="small muted">JPG, PNG ou WebP. A imagem é reduzida antes do envio.</p>
      </div>
      <div>
        <form id="profileForm" novalidate>
          <div class="form-grid">
            <div class="field">
      <label for="pNome">Nome</label>
      <input class="input" id="pNome" name="nome" maxlength="80" autocomplete="name" required>
      
    </div>
            <div class="field">
      <label for="pCidade">Cidade</label>
      <input class="input" id="pCidade" name="cidade" maxlength="80" autocomplete="address-level2" placeholder="São Paulo">
      
    </div>
            <div class="field full">
              <label for="pBio">Bio</label>
              <textarea class="textarea" id="pBio" name="bio" maxlength="280" aria-describedby="pBioCount" placeholder="Seu estilo, o que você garimpa, seus bairros preferidos…"></textarea>
              <p class="hint" id="pBioCount">0/280</p>
            </div>
            <div class="field full">
      <label for="pEmail">E-mail de acesso</label>
      <input class="input" id="pEmail" type="email" readonly aria-describedby="pEmail-dica">
      <p class="hint" id="pEmail-dica">O e-mail de login não pode ser alterado por aqui.</p>
    </div>
          </div>
          <p class="form-status" id="profileStatus" style="margin-top:1.25rem"></p>
          <div style="margin-top:1.25rem"><button class="btn" type="submit" id="profileSave">Salvar alterações</button></div>
        </form>
        <p id="roleNote" style="margin-top:2rem" class="small"></p>
        <hr class="rule" style="margin-block:2.5rem">
        <h2 style="font-size:1.4rem">Alterar senha</h2>
        <form id="passForm" novalidate style="margin-top:1rem">
          <div class="form-grid">
            <div class="field">
      <label for="newPass">Nova senha</label>
      <input class="input" id="newPass" type="password" autocomplete="new-password" minlength="8">
      <p class="hint" id="newPass-dica">Mínimo de 8 caracteres.</p>
    </div>
            <div class="field">
      <label for="newPass2">Repita a nova senha</label>
      <input class="input" id="newPass2" type="password" autocomplete="new-password">
      
    </div>
          </div>
          <p class="form-status" id="passStatus" style="margin-top:1rem"></p>
          <div style="margin-top:1rem"><button class="btn btn-outline" type="submit" id="passSave">Alterar senha</button></div>
        </form>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <noscript><p class="noscript">O Repeteco precisa de JavaScript para funcionar.</p></noscript>
</body>
</html>
